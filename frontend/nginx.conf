# nginx del frontend: sirve la SPA y proxea /api al backend (mismo dominio, sin CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Límite de subida (logo, imágenes).
    client_max_body_size 6m;

    # -------------------------------------------------------------------------
    # Compresion. Sin esto el bundle viajaba entero (~860 KB) y cada listado de
    # productos o reporte iba en JSON plano. Con gzip bajan a ~1/4.
    # `gzip_proxied any` es lo que hace que tambien se comprima lo que devuelve
    # el backend a traves del proxy /api/.
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;          # 5 = buen equilibrio tamaño/CPU
    gzip_min_length 512;        # comprimir 100 bytes cuesta mas de lo que ahorra
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Archivos estáticos con cache largo. Los nombres llevan hash, asi que un
    # deploy nuevo cambia la URL y no hay riesgo de servir algo viejo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # El index.html NUNCA se cachea: es quien apunta a los assets con hash. Si el
    # navegador lo guarda, tras un deploy sigue pidiendo los bundles viejos.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Las llamadas a la API van al backend (servicio "backend" del compose).
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket de tiempo real (Socket.IO): requiere upgrade de conexion.
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sin timeout corto: la conexion es de larga vida.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: cualquier ruta desconocida devuelve index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
