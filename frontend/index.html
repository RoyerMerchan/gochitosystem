<!doctype html>
<html lang="es-VE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="description" content="Mini Market Los Gochitos — punto de venta, inventario y creditos" />
    <!-- PWA: instalar como app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Los Gochitos" />
    <title>Los Gochitos — POS</title>
    <script>
      /*
       * Atrapa el evento de "se puede instalar" ANTES de que cargue la app.
       *
       * El navegador lo dispara al terminar de cargar la pagina, y el navbar de
       * React monta mucho despues (login + rutas en diferido). Si nadie lo
       * escucha aca, el evento se pierde para siempre y el boton de instalar no
       * aparece nunca. Se guarda en window y se avisa, para que el boton lo tome
       * cuando monte, llegue temprano o tarde.
       */
      window.__promptInstalar = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__promptInstalar = e;
        window.dispatchEvent(new Event('gochito:instalable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__promptInstalar = null;
      });
    </script>
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar el parpadeo blanco.
      (function () {
        try {
          var crudo = localStorage.getItem('gochito.ui');
          var tema = crudo ? JSON.parse(crudo).state.tema : 'sistema';
          var oscuro =
            tema === 'oscuro' ||
            (tema === 'sistema' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', oscuro);
        } catch (e) {
          /* sin tema guardado: se usa el claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
